<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draft, review, and print Washington State estate planning documents in your browser: will, remains directive, health care directive, and powers of attorney."
    />
    <meta
      name="theme-color"
      content="#f5f1ea"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141311"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141311'/%3E%3Cpath d='M9 6h10l5 5v15H9z' fill='%23f5f1ea'/%3E%3Cpath d='M12 16h8M12 20h8' stroke='%23141311' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <!-- CSP script hash covers the inline theme script below; recompute it after any edit to that script. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-YsMSZVyShGDOuQRf9TH4vtB0+YPQhtrYlu1nFuj4Uvg='; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'; img-src 'self' data:"
    />
    <title>Estate Document Templates</title>
    <script>
      // Runs before first paint so the theme is correct with no flash.
      // Mirrors src/ui/theme.ts's persisted value and storage key.
      (function () {
        try {
          var theme = localStorage.getItem("estate_templates_theme_v1");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch {
          // Storage may be unavailable or the stored value malformed —
          // fall back to the system preference tokens.css already handles.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
