<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="theme-color"
      content="#f5f1ea"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141311"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141311'/%3E%3Cpath d='M9 6h10l5 5v15H9z' fill='%23f5f1ea'/%3E%3Cpath d='M12 16h8M12 20h8' stroke='%23141311' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <!-- CSP script hashes cover the two inline scripts below; recompute them after any edit to either. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-O1oR5XGYe8E41IiybqyfCcrlXD5juDfXFKnT/uejUpQ=' 'sha256-jeKYY9MkugEgQU2TwVk9Q2L7LAg5b3fGF383p3Lw3Jo='; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'; img-src 'self' data:"
    />
    <!--site-head-->
    <link rel="stylesheet" href="/src/site/site.css" />
    <script type="module" src="/src/site/theme.ts"></script>
    <script>
      // Runs before first paint so the theme is correct with no flash.
      // Mirrors src/ui/theme.ts's persisted value and storage key.
      (function () {
        try {
          var theme = localStorage.getItem("estate_templates_theme_v1");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch {
          // Storage or matchMedia unavailable: leave the default light tokens.
        }
      })();
    </script>
    <script>
      // Hash routes belong to the app.
      if (location.hash.indexOf("#/") === 0)
        location.replace("app/" + location.hash);
    </script>
  </head>
  <body>
    <!--site-body-->
  </body>
</html>
