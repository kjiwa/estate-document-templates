<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Estate Document Templates — Washington State estate planning documents"
    />
    <title>Estate Document Templates</title>
    <script>
      // Runs before first paint so the theme is correct with no flash.
      // Mirrors src/ui/theme.ts's persisted value and storage key.
      (function () {
        try {
          var theme = localStorage.getItem("estate_templates_theme_v1");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch {
          // Storage may be unavailable or the stored value malformed —
          // fall back to the system preference tokens.css already handles.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
